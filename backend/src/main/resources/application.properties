# ============================================================
# application.properties — base config (loaded always)
# Override per-profile in application-dev.properties / prod
# ============================================================

spring.application.name=mit-credit-management

# ── Active profile (override via env var: SPRING_PROFILES_ACTIVE) ──
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ── Server ──
server.port=8080
server.servlet.context-path=/api

# ── Caching ──
spring.cache.type=caffeine
spring.cache.cache-names=activeSemesters,courses,cgpa
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=15m

# ── JPA ──
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=public

# ── Flyway (migrations run automatically on startup) ──
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ── JWT ──
app.jwt.secret=${JWT_SECRET:super_secret_jwt_key_that_is_at_least_256_bits_long}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ── CORS (overridden per profile) ──
app.cors.allowed-origins=${CORS_ORIGINS}

# ── SpringDoc / Swagger UI ──
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.show-actuator=false

# ── Logging (SLF4J MDC pattern includes correlationId) ──
logging.level.com.iit=DEBUG
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n

# ============================================================
# OBSERVABILITY — Spring Boot Actuator + Micrometer/Prometheus
# Standard at every Google/Amazon/Microsoft production service
# ============================================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus,loggers
management.endpoint.health.show-details=when-authorized
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=${spring.profiles.active}
management.info.env.enabled=true
info.app.name=MIT Open Credit Management System
info.app.version=1.0.0
info.app.team=IIT, University of Dhaka

# ============================================================
# RESILIENCE4J — Circuit Breaker (Pro-tier fault tolerance)
# Prevents cascading failures; isolates notification/audit calls
# ============================================================
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.configs.default.slow-call-duration-threshold=2s
resilience4j.circuitbreaker.configs.default.slow-call-rate-threshold=80
resilience4j.circuitbreaker.instances.notificationService.base-config=default
resilience4j.circuitbreaker.instances.gradeService.base-config=default

resilience4j.retry.configs.default.max-attempts=3
resilience4j.retry.configs.default.wait-duration=500ms
resilience4j.retry.instances.notificationService.base-config=default

# ============================================================
# ASYNC EXECUTION — Non-blocking audit + notification dispatch
# ============================================================
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=16
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=async-worker-

