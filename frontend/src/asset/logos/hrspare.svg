<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <style>
    .circle {
      fill: none;
      stroke: #00AEEF;
      stroke-width: 3;
    }
    .text {
      fill: #f7f9fa;
      font-family: 'Arial Black', sans-serif;
      font-size: 44px;
      font-weight: 900;
      letter-spacing: -0.5px;
      dominant-baseline: middle;
      text-anchor: middle;
    }
    .span {
      fill: #f7f9fa;
      font-family: 'Arial Black', sans-serif;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 2px;
      dominant-baseline: middle;
      text-anchor: middle;
    }
  </style>
  <circle cx="50" cy="50" r="46" class="circle"/>
  <text x="50" y="46" class="text">HR</text>
  <text x="50" y="68" class="span">Spare</text>
</svg>
