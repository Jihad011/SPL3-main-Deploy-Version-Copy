<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="portBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="scrollGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="portGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="120" height="120" rx="28" fill="url(#portBg)" filter="url(#portGlow)"/>
  <!-- Certificate / Dossier Scroll -->
  <g transform="translate(24, 20)">
    <!-- Certificate Paper -->
    <rect x="6" y="8" width="60" height="72" rx="6" fill="url(#scrollGrad)" stroke="rgba(255,255,255,0.8)" stroke-width="2"/>
    <!-- Header banner on certificate -->
    <rect x="14" y="16" width="44" height="6" rx="2" fill="#0284c7"/>
    <!-- Text lines -->
    <line x1="14" y1="28" x2="58" y2="28" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="14" y1="36" x2="52" y2="36" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="14" y1="44" x2="58" y2="44" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="14" y1="52" x2="40" y2="52" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Gold Wax Ribbon Seal -->
    <circle cx="50" cy="62" r="11" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>
    <polygon points="50,56 52,60 56,60 53,63 54,67 50,65 46,67 47,63 44,60 48,60" fill="#ffffff"/>
    <!-- Ribbon tails -->
    <path d="M46 72 l-4 8 l6 -2 l6 2 l-4 -8 Z" fill="#d97706"/>
  </g>
</svg>
