<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="dosBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="folderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="dosGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6d28d9" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="120" height="120" rx="28" fill="url(#dosBg)" filter="url(#dosGlow)"/>
  <g transform="translate(20, 20)">
    <!-- Dossier Audit Folder 3D -->
    <!-- Back Folder Flap -->
    <path d="M8 20 h24 l8 8 h32 c4 0 6 2 6 6 v40 c0 4 -2 6 -6 6 h-64 c-4 0 -6 -2 -6 -6 v-48 c0 -4 2 -6 6 -6 Z" fill="#b45309"/>
    <!-- White Document inside folder sticking out -->
    <rect x="18" y="10" width="48" height="52" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <line x1="26" y1="18" x2="58" y2="18" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="26" y1="26" x2="52" y2="26" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <line x1="26" y1="34" x2="58" y2="34" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <!-- Front Folder Body -->
    <path d="M6 32 h68 c4 0 6 2 6 6 v36 c0 4 -2 6 -6 6 h-68 c-4 0 -6 -2 -6 -6 v-36 c0 -4 2 -6 6 -6 Z" fill="url(#folderGrad)"/>
    <!-- Student Avatar Stamp / Audit Tag -->
    <circle cx="58" cy="62" r="12" fill="#7c3aed" stroke="#ffffff" stroke-width="2"/>
    <circle cx="58" cy="58" r="4.5" fill="#ffffff"/>
    <path d="M51 68 c0 -4 3.5 -5.5 7 -5.5 s7 1.5 7 5.5 Z" fill="#ffffff"/>
  </g>
</svg>
