<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="finBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="vaultGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
    <filter id="finGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#991b1b" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="120" height="120" rx="28" fill="url(#finBg)" filter="url(#finGlow)"/>
  <g transform="translate(20, 20)">
    <!-- Ledger Book & Safe Vault 3D -->
    <rect x="8" y="10" width="64" height="68" rx="8" fill="url(#vaultGrad)" stroke="rgba(255,255,255,0.9)" stroke-width="2"/>
    <!-- Red Book Spine -->
    <rect x="8" y="10" width="12" height="68" rx="4" fill="#b91c1c"/>
    <!-- Line accents -->
    <line x1="26" y1="22" x2="62" y2="22" stroke="#991b1b" stroke-width="3" stroke-linecap="round"/>
    <line x1="26" y1="32" x2="56" y2="32" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="26" y1="42" x2="62" y2="42" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="26" y1="52" x2="48" y2="52" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Floating Gold Coin with BDT symbol ৳ -->
    <circle cx="58" cy="58" r="14" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
    <circle cx="58" cy="58" r="11" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
    <text x="58" y="64" font-size="16" font-weight="900" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif">৳</text>
  </g>
</svg>
