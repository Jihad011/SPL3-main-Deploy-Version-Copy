<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="teachBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <filter id="teachGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#065f46" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="120" height="120" rx="28" fill="url(#teachBg)" filter="url(#teachGlow)"/>
  <g transform="translate(20, 20)">
    <!-- Blackboard Frame -->
    <rect x="6" y="8" width="68" height="48" rx="6" fill="#d97706" stroke="#b45309" stroke-width="2"/>
    <!-- Blackboard Surface -->
    <rect x="10" y="12" width="60" height="40" rx="4" fill="url(#boardGrad)"/>
    <!-- Chalk writing -->
    <line x1="16" y1="20" x2="34" y2="20" stroke="#a7f3d0" stroke-width="2" stroke-linecap="round"/>
    <line x1="16" y1="28" x2="48" y2="28" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="16" y1="36" x2="38" y2="36" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <circle cx="58" cy="24" r="5" fill="none" stroke="#fcd34d" stroke-width="1.5"/>
    <!-- Teacher Podium Stand -->
    <path d="M26 58 L32 76 H48 L54 58 Z" fill="#92400e"/>
    <rect x="22" y="56" width="36" height="5" rx="2" fill="#d97706"/>
    <!-- Graduation Cap / Teaching Badge -->
    <circle cx="62" cy="64" r="12" fill="#3b82f6" stroke="#ffffff" stroke-width="2"/>
    <!-- Cap on badge -->
    <polygon points="62,58 54,62 62,66 70,62" fill="#ffffff"/>
    <path d="M57 64 v3 c0 1.5 2.2 3 5 3 s5 -1.5 5 -3 v-3" fill="#ffffff"/>
  </g>
</svg>
