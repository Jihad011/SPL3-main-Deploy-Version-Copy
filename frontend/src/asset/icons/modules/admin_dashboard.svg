<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="admBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="pillarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <filter id="admGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1e3a8a" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="120" height="120" rx="28" fill="url(#admBg)" filter="url(#admGlow)"/>
  <g transform="translate(24, 22)">
    <!-- University Admin Building 3D -->
    <!-- Pediment (Triangle Roof) -->
    <polygon points="36,8 6,24 66,24" fill="url(#pillarGrad)" stroke="rgba(255,255,255,0.8)" stroke-width="1.5"/>
    <circle cx="36" cy="18" r="3.5" fill="#1e3a8a"/>
    <!-- Architrave -->
    <rect x="6" y="24" width="60" height="5" rx="1.5" fill="#93c5fd"/>
    <!-- 4 Pillars -->
    <rect x="11" y="29" width="8" height="32" rx="2" fill="url(#pillarGrad)"/>
    <rect x="25" y="29" width="8" height="32" rx="2" fill="url(#pillarGrad)"/>
    <rect x="39" y="29" width="8" height="32" rx="2" fill="url(#pillarGrad)"/>
    <rect x="53" y="29" width="8" height="32" rx="2" fill="url(#pillarGrad)"/>
    <!-- Base -->
    <rect x="4" y="61" width="64" height="6" rx="2" fill="#93c5fd"/>
    <rect x="1" y="67" width="70" height="7" rx="2.5" fill="url(#pillarGrad)"/>
    <!-- Glowing Admin Gear / Star Badge -->
    <circle cx="58" cy="18" r="11" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
    <polygon points="58,13 60,16.5 64,16.5 61,19 62,23 58,20.5 54,23 55,19 52,16.5 56,16.5" fill="#ffffff"/>
  </g>
</svg>
