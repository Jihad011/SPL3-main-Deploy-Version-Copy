<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="feeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <filter id="feeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#e11d48" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="120" height="120" rx="28" fill="url(#feeBg)" filter="url(#feeGlow)"/>
  <!-- Credit Card / Invoice Document 3D Isometric slant -->
  <g transform="translate(18, 22)">
    <!-- Back card -->
    <rect x="14" y="6" width="62" height="42" rx="8" fill="rgba(255,255,255,0.3)"/>
    <!-- Main front card -->
    <rect x="6" y="16" width="72" height="48" rx="8" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.6)" stroke-width="1.5"/>
    <!-- Chip -->
    <rect x="14" y="24" width="14" height="10" rx="2.5" fill="#f59e0b"/>
    <!-- Magnetic strip / line -->
    <line x1="6" y1="42" x2="78" y2="42" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Card text / number dots -->
    <circle cx="16" cy="52" r="2" fill="#64748b"/>
    <circle cx="23" cy="52" r="2" fill="#64748b"/>
    <circle cx="30" cy="52" r="2" fill="#64748b"/>
    <circle cx="37" cy="52" r="2" fill="#64748b"/>
    <!-- Coin / Badge -->
    <circle cx="64" cy="50" r="12" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
    <text x="64" y="55" font-size="13" font-weight="900" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif">৳</text>
  </g>
</svg>
