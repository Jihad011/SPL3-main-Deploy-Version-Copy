<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="grdBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="sheetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ecfeff"/>
    </linearGradient>
    <filter id="grdGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0891b2" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="120" height="120" rx="28" fill="url(#grdBg)" filter="url(#grdGlow)"/>
  <g transform="translate(20, 20)">
    <!-- Spreadsheet / Assessment Grid 3D -->
    <rect x="6" y="8" width="68" height="66" rx="8" fill="url(#sheetGrad)" stroke="rgba(255,255,255,0.9)" stroke-width="2"/>
    <!-- Top Table Header -->
    <path d="M6 16 c0 -4.5 3.5 -8 8 -8 h52 c4.5 0 8 3.5 8 8 v8 h-68 Z" fill="#0891b2"/>
    <line x1="28" y1="8" x2="28" y2="74" stroke="#cffafe" stroke-width="1.5"/>
    <line x1="50" y1="8" x2="50" y2="74" stroke="#cffafe" stroke-width="1.5"/>
    <line x1="6" y1="36" x2="74" y2="36" stroke="#cffafe" stroke-width="1.5"/>
    <line x1="6" y1="48" x2="74" y2="48" stroke="#cffafe" stroke-width="1.5"/>
    <line x1="6" y1="60" x2="74" y2="60" stroke="#cffafe" stroke-width="1.5"/>
    <!-- Checkmarks / marks inside cells -->
    <circle cx="17" cy="30" r="3" fill="#10b981"/>
    <circle cx="17" cy="42" r="3" fill="#10b981"/>
    <circle cx="17" cy="54" r="3" fill="#10b981"/>
    <text x="39" y="33" font-size="9" font-weight="900" text-anchor="middle" fill="#0e7490" font-family="Arial, sans-serif">95</text>
    <text x="39" y="45" font-size="9" font-weight="900" text-anchor="middle" fill="#0e7490" font-family="Arial, sans-serif">88</text>
    <!-- A+ Stamp Badge in foreground -->
    <circle cx="62" cy="62" r="14" fill="#ef4444" stroke="#ffffff" stroke-width="2"/>
    <text x="62" y="67" font-size="12" font-weight="900" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif">A+</text>
  </g>
</svg>
