  <rect x="46" y="86" width="28" height="8" rx="3" fill="#b45309"/>
  <!-- Star on trophy -->
  <polygon points="60,44 62,50 68,50 63,54 65,60 60,56 55,60 57,54 52,50 58,50" fill="#ffffff"/>
