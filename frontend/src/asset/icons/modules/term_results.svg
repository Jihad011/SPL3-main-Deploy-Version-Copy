<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="resBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="resGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#059669" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="120" height="120" rx="28" fill="url(#resBg)" filter="url(#resGlow)"/>
  <!-- Chart Bars in background -->
  <rect x="26" y="66" width="14" height="28" rx="4" fill="rgba(255,255,255,0.3)"/>
  <rect x="44" y="52" width="14" height="42" rx="4" fill="rgba(255,255,255,0.45)"/>
  <rect x="62" y="38" width="14" height="56" rx="4" fill="rgba(255,255,255,0.6)"/>
  <rect x="80" y="26" width="14" height="68" rx="4" fill="rgba(255,255,255,0.85)"/>
  <!-- Trophy in foreground -->
  <path d="M42 34 h36 v22 c0 10 -8 18 -18 18 s-18 -8 -18 -18 Z" fill="url(#goldGrad)"/>
  <path d="M34 38 c-6 0 -10 5 -10 11 s5 11 11 11 h7 v-6 h-7 c-3 0 -5 -2 -5 -5 s2 -5 5 -5 h7 v-6 Z" fill="url(#goldGrad)"/>
