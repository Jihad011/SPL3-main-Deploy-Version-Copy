<button
      (click)="save()"
      [disabled]="disabled || frmGroup().invalid"
      class="nav-action-btn nav-action-btn--save"
      [attr.aria-label]="label"
    >
      <app-icon name="check" [size]="16" class="nav-action-icon"></app-icon>
      <span class="nav-action-label">{{ label }}</span>
    </button>
