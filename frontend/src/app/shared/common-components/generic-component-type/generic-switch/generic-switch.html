@if (!isHidden) {
  <div style="width: 100%;" [formGroup]="frmGroup()">

    <!-- Vertical layout -->
    @if (displayMode() === 'vertical') {
      <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 0.4rem;">
        @if (label()) {
          <label [for]="id()" class="input-label" style="cursor: pointer; margin-bottom: 0;">
            {{ label() }}
            @if (isRequired()) { <span style="color: #ef4444; margin-left: 2px;">*</span> }
          </label>
        }
        <div style="position: relative;">
          <input type="checkbox" [id]="id()" [formControlName]="controlName()"
            [attr.controlName]="controlName()" [style]="style()"
            (change)="toggleSwitch()" class="gs-sr-only">

          <div class="gs-track"
            [ngClass]="{'gs-track--on': currentValue, 'gs-track--disabled': isDisabled, 'gs-track--invalid': isInvalidState()}"
            (click)="!isDisabled && toggleSwitch()">
            <div class="gs-thumb" [ngClass]="{'gs-thumb--on': currentValue}">
              @if (currentValue) {
                <svg style="width: 12px; height: 12px; color: var(--theme-primary, #086AD8);" fill="currentColor" viewBox="0 0 20 20">
                  <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/>
                </svg>
              }
              @if (!currentValue) {
                <svg style="width: 10px; height: 10px; color: #9ca3af;" fill="currentColor" viewBox="0 0 20 20">
                  <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/>
                </svg>
              }
            </div>
          </div>
        </div>
      </div>
    }

    @else {
      <!-- Horizontal layout -->
      <div style="display: flex; align-items: center; gap: 0.75rem;">
        <div style="position: relative;">
          <input type="checkbox" [id]="id()" [formControlName]="controlName()"
            [attr.controlName]="controlName()" [style]="style()"
            (change)="toggleSwitch()" class="gs-sr-only">

          <div class="gs-track"
            [ngClass]="{'gs-track--on': currentValue, 'gs-track--disabled': isDisabled, 'gs-track--invalid': isInvalidState()}"
            (click)="!isDisabled && toggleSwitch()">
            <div class="gs-thumb" [ngClass]="{'gs-thumb--on': currentValue}">
              @if (currentValue) {
                <svg style="width: 12px; height: 12px; color: var(--theme-primary, #086AD8);" fill="currentColor" viewBox="0 0 20 20">
                  <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/>
                </svg>
              }
              @if (!currentValue) {
                <svg style="width: 10px; height: 10px; color: #9ca3af;" fill="currentColor" viewBox="0 0 20 20">
                  <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/>
                </svg>
              }
            </div>
          </div>
        </div>

        @if (label()) {
          <label [for]="id()" class="input-label" style="cursor: pointer; margin-bottom: 0; font-size: 13px;">
            {{ label() }}
            @if (isRequired()) { <span style="color: #ef4444; margin-left: 2px;">*</span> }
          </label>
        }
      </div>
    }

    <!-- Error Message -->
    @if (isInvalidState()) {
      <div class="input-error-msg" style="display: flex; align-items: center; gap: 4px; margin-top: 4px;">
        <svg style="width: 12px; height: 12px; flex-shrink: 0;" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
        </svg>
        {{ errorMessage() }}
      </div>
    }
  </div>
}
