<div
  class="summary-strip"
  [class.summary-strip--modal]="displayMode() === 'modal'"
>
  @for (item of visibleItems(); track item.key) {
    <article
      class="summary-card"
      [attr.data-tone]="item.tone || 'neutral'"
      [attr.title]="item.tooltip || null"
    >
      <div class="summary-card__icon" aria-hidden="true">
        @switch (item.icon) {
          @case ('calendar') {
            <svg viewBox="0 0 24 24">
              <rect x="3" y="5" width="18" height="16" rx="2"></rect>
              <path d="M16 3v4M8 3v4M3 10h18"></path>
            </svg>
          }
          @case ('pause') {
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="9"></circle>
              <path d="M10 9v6M14 9v6"></path>
            </svg>
          }
          @case ('processing') {
            <svg viewBox="0 0 24 24">
              <path d="M20 7h-5V2"></path>
              <path d="M20 7a8 8 0 1 0 1 7"></path>
            </svg>
          }
          @case ('failed') {
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="9"></circle>
              <path d="m9 9 6 6m0-6-6 6"></path>
            </svg>
          }
          @case ('completed') {
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="9"></circle>
              <path d="m8 12 3 3 5-6"></path>
            </svg>
          }
          @default {
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="9"></circle>
              <path d="M12 11v5M12 8h.01"></path>
            </svg>
          }
        }
      </div>

      <div class="summary-card__content">
        <span class="summary-card__label">{{ item.label }}</span>
        <strong class="summary-card__value">{{ item.value }}</strong>
      </div>
    </article>
  }
</div>
