name: MIT OCMS - Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Test & Build (Spring Boot 3 + Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run Backend Unit & Integration Tests
        working-directory: ./backend
        env:
          CORS_ORIGINS: http://localhost:4200
          JWT_SECRET: super_secret_jwt_key_that_is_at_least_256_bits_long_for_spl3_testing
        run: mvn clean test -B

  frontend-build:
    name: Frontend Verification & Build (Angular 18 + Node 20)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Validate TypeScript Compilation
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Build Production Bundle
        working-directory: ./frontend
        run: npm run build:prod
